<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Clone</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login">

    <h1><img src="images/logo.png" alt="구글"></h1>

    <div id="step1">
        <h2>로그인</h2>
        <p class="sub">Google 계정 사용</p>

        <form>
            <div class="input_group">
                <input type="text" id="user_id" required>
                <label>이메일 또는 휴대전화</label>
            </div>

            <div class="link">
                <a href="#">이메일을 잊으셨나요?</a>
            </div>

            <p class="desc">
                내 컴퓨터가 아닌가요? 게스트 모드를 사용하여 비공개로 로그인하세요.
                <a href="#">게스트 모드 사용 방법 자세히 알아보기</a>
            </p>

            <div class="bottom">
                <a href="#" class="join">계정 만들기</a>
                <button type="button" id="next_btn">다음</button>
            </div>
        </form>
    </div>

    <div id="step2" class="hidden">
        <h2>시작하기</h2>

        <div class="email_box">
            <span id="user_email"></span>
        </div>

        <form>
            <div class="input_group">
                <input type="password" id="user_pw" required>
                <label>비밀번호 입력</label>
            </div>

            <div class="link">
                <a href="#">비밀번호를 잊으셨나요?</a>
            </div>

            <div class="bottom">
                <a href="#" id="back_btn">다른 계정 사용</a>
                <button type="submit" id="login_btn">다음</button>
            </div>
        </form>
    </div>

    <footer>
        <select>
            <option>한국어</option>
        </select>
        <div class="right">
            <a href="#">도움말</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">약관</a>
        </div>
    </footer>

</div>

<script>
const nextBtn = document.getElementById("next_btn");
const backBtn = document.getElementById("back_btn");

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");

const userId = document.getElementById("user_id");
const userEmail = document.getElementById("user_email");

nextBtn.addEventListener("click", () => {
    if(userId.value.trim() === ""){
        alert("이메일을 입력하세요");
        return;
    }

    userEmail.textContent = userId.value;

    step1.classList.add("hidden");
    step2.classList.remove("hidden");
});

backBtn.addEventListener("click", (e) => {
    e.preventDefault();
    step2.classList.add("hidden");
    step1.classList.remove("hidden");
});
</script>

</body>
</html>
